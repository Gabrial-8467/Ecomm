# Local production-like stack. Do not deploy this file as-is: replace every
# placeholder secret and put TLS in front of the web service.
name: casacircuit

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casacircuit
      POSTGRES_PASSWORD: casacircuit
      POSTGRES_DB: casacircuit
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casacircuit -d casacircuit']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://casacircuit:casacircuit@db:5432/casacircuit
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: CasaCircuit
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.invalid}
      DATABASE_URL: postgresql://casacircuit:casacircuit@db:5432/casacircuit
      DIRECT_DATABASE_URL: postgresql://casacircuit:casacircuit@db:5432/casacircuit
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: casacircuit
      REDIS_REQUIRED: 'true'
      SESSION_COOKIE_NAME: cc_session
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-1234567890}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me-123456789012}
      OTP_PEPPER: ${OTP_PEPPER:-dev-only-otp-pepper-change-me-12345678901234}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      EMAIL_PROVIDER: console
      EMAIL_FROM: 'CasaCircuit <orders@example.invalid>'
      SMS_PROVIDER: console
      STORAGE_PROVIDER: local
      SHIPPING_PROVIDER: mock
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local_placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-local_placeholder_webhook}
      LOG_LEVEL: info
      LOG_FORMAT: json
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.invalid}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: Operations Admin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-data:
